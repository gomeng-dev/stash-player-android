name: Bug report
description: Report a reproducible problem in Stash Android Player
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Please do not include private media, real server URLs, API keys, cookies, passwords, screenshots of private libraries, or unredacted logs.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The Stash Android Player version where the bug appears.
      placeholder: "v1.7.10"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android device and OS
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: input
    id: stash-version
    attributes:
      label: Stash server version
      placeholder: "v0.27.2"
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup / connection
        - Home
        - Explore / search / filters
        - Player
        - Queue / local lists
        - Shorts
        - Images / galleries
        - Recommendations
        - Settings
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Attach only redacted logs or screenshots with safe demo data.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy-check
    attributes:
      label: Privacy check
      options:
        - label: I removed private media, server URLs, credentials, cookies, API keys, filenames, and personal library data from this report.
          required: true
