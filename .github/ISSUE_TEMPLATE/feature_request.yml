name: Feature request
description: Suggest an improvement for Stash Android Player
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Please keep examples privacy-safe. Do not include private media, real server URLs, credentials, or screenshots of personal libraries.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need or frustration behind the request.
      placeholder: "When using the app on a phone, I want to..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the app do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup / connection
        - Home
        - Explore / search / filters
        - Player
        - Queue / local lists
        - Shorts
        - Images / galleries
        - Recommendations
        - Settings
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Are there simpler workarounds or other designs?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Add safe mockups, screenshots with demo data, or related links.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I avoided private media, real server URLs, credentials, cookies, API keys, filenames, and personal library data.
          required: true
